<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pakistan News</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

header {
    background: #087a3d;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

nav {
    background: white;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    box-shadow: 0 2px 5px #bbb;
}

nav button {
    background: #087a3d;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

nav button:hover {
    background: #055b2d;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
}

#sectionTitle {
    color: #087a3d;
    border-bottom: 3px solid #087a3d;
    padding-bottom: 8px;
}

.news-card {
    background: white;
    margin: 15px 0;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 7px #ccc;
}

.news-card h2 {
    margin-top: 0;
    color: #222;
}

.news-card p {
    color: #555;
    line-height: 1.6;
}

.news-card small {
    color: #087a3d;
    font-weight: bold;
}

footer {
    background: #087a3d;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>🇵🇰 Pakistan News</h1>
    <p>Latest News & Updates</p>
</header>

<nav>
    <button onclick="showNews('latest')">Latest News</button>
    <button onclick="showNews('lahore')">Lahore News</button>
    <button onclick="showNews('karachi')">Karachi News</button>
    <button onclick="showNews('islamabad')">Islamabad News</button>
    <button onclick="showNews('national')">National Update</button>
</nav>

<div class="container">

    <h2 id="sectionTitle">Latest News</h2>

    <div id="newsContainer"></div>

</div>

<footer>
    © 2026 Pakistan News
</footer>

<script>

const news = {

    latest: [
        {
            title: "پاکستان کی تازہ ترین خبریں",
            text: "یہاں پاکستان کی تازہ ترین اہم خبریں اور قومی اپڈیٹس دکھائی جائیں گی۔",
            source: "Latest News"
        },
        {
            title: "ملک بھر کی اہم پیش رفت",
            text: "پاکستان کے مختلف شہروں سے اہم معلومات اور تازہ اپڈیٹس یہاں شامل کی جائیں گی۔",
            source: "Pakistan News"
        }
    ],

    lahore: [
        {
            title: "لاہور کی تازہ خبر",
            text: "لاہور شہر سے متعلق تازہ ترین خبریں اور اہم مقامی اپڈیٹس یہاں دکھائی جائیں گی۔",
            source: "Lahore News"
        },
        {
            title: "لاہور میں اہم پیش رفت",
            text: "لاہور کے مختلف علاقوں سے اہم معلومات اور خبریں یہاں شامل ہوں گی۔",
            source: "Lahore News"
        }
    ],

    karachi: [
        {
            title: "کراچی کی تازہ خبر",
            text: "کراچی شہر سے متعلق تازہ ترین خبریں اور مقامی اپڈیٹس یہاں دکھائی جائیں گی۔",
            source: "Karachi News"
        },
        {
            title: "کراچی میں اہم پیش رفت",
            text: "کراچی کے مختلف علاقوں سے اہم معلومات اور خبریں یہاں شامل ہوں گی۔",
            source: "Karachi News"
        }
    ],

    islamabad: [
        {
            title: "اسلام آباد کی تازہ خبر",
            text: "اسلام آباد سے متعلق تازہ ترین خبریں اور اہم اپڈیٹس یہاں دکھائی جائیں گی۔",
            source: "Islamabad News"
        },
        {
            title: "وفاقی دارالحکومت کی اہم خبر",
            text: "اسلام آباد میں ہونے والی اہم سرگرمیوں اور خبروں کی اپڈیٹس یہاں شامل ہوں گی۔",
            source: "Islamabad News"
        }
    ],

    national: [
        {
            title: "قومی اپڈیٹ",
            text: "پاکستان بھر سے قومی سطح کی اہم خبریں اور تازہ اپڈیٹس یہاں دکھائی جائیں گی۔",
            source: "National Update"
        },
        {
            title: "پاکستان کی اہم قومی خبر",
            text: "ملک کی اہم قومی صورتحال اور تازہ معلومات یہاں شامل کی جائیں گی۔",
            source: "National Update"
        }
    ]

};

function showNews(category) {

    const container = document.getElementById("newsContainer");
    const title = document.getElementById("sectionTitle");

    const names = {
        latest: "Latest News",
        lahore: "Lahore News",
        karachi: "Karachi News",
        islamabad: "Islamabad News",
        national: "National Update"
    };

    title.innerText = names[category];

    container.innerHTML = "";

    news[category].forEach(item => {

        container.innerHTML += `
            <div class="news-card">
                <h2>${item.title}</h2>
                <p>${item.text}</p>
                <small>Source: ${item.source}</small>
            </div>
        `;

    });

}

showNews("latest");

</script>

</body>
</html>
