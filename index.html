<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pakistan News</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

header {
    background: #087a3d;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
}

nav {
    background: white;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    box-shadow: 0 2px 5px #bbb;
}

nav button {
    background: #087a3d;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

nav button:hover {
    background: #055b2d;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-bottom: 18px;
    font-size: 15px;
}

#sectionTitle {
    color: #087a3d;
    border-bottom: 3px solid #087a3d;
    padding-bottom: 8px;
}

.news-card {
    background: white;
    margin: 15px 0;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 7px #ccc;
}

.news-card h2 {
    margin-top: 0;
    color: #222;
    font-size: 20px;
}

.news-card p {
    color: #555;
    line-height: 1.6;
}

.news-card a {
    display: inline-block;
    margin-top: 8px;
    background: #087a3d;
    color: white;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 5px;
}

.news-card small {
    color: #087a3d;
    font-weight: bold;
}

.loading {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 8px;
}

.error {
    background: white;
    padding: 20px;
    text-align: center;
    color: #b00000;
    border-radius: 8px;
}

footer {
    background: #087a3d;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>🇵🇰 Pakistan News</h1>
    <p>Latest News & Updates from Pakistan</p>
</header>

<nav>
    <button onclick="showNews('latest')">Latest News</button>
    <button onclick="showNews('lahore')">Lahore News</button>
    <button onclick="showNews('karachi')">Karachi News</button>
    <button onclick="showNews('islamabad')">Islamabad News</button>
    <button onclick="showNews('national')">National Updates</button>
</nav>

<div class="container">

    <input
        type="text"
        id="searchBox"
        class="search"
        placeholder="🔎 Search News..."
        onkeyup="searchNews()"
    >

    <h2 id="sectionTitle">Latest News</h2>

    <div id="newsContainer">
        <div class="loading">
            Loading latest news...
        </div>
    </div>

</div>

<footer>
    © 2026 Pakistan News
</footer>

<script>

let currentCategory = "latest";
let allNews = [];

const categories = {

    latest: {
        title: "Latest News",
        query: "Pakistan latest news"
    },

    lahore: {
        title: "Lahore News",
        query: "Lahore Pakistan news"
    },

    karachi: {
        title: "Karachi News",
        query: "Karachi Pakistan news"
    },

    islamabad: {
        title: "Islamabad News",
        query: "Islamabad Pakistan news"
    },

    national: {
        title: "National Updates",
        query: "Pakistan national news"
    }

};


async function showNews(category) {

    currentCategory = category;

    const container =
        document.getElementById("newsContainer");

    const title =
        document.getElementById("sectionTitle");

    title.innerText =
        categories[category].title;

    container.innerHTML = `
        <div class="loading">
            🔄 تازہ خبریں لوڈ ہو رہی ہیں...
        </div>
    `;

    try {

        const rssURL =
            "https://news.google.com/rss/search?q=" +
            encodeURIComponent(categories[category].query) +
            "&hl=en-PK&gl=PK&ceid=PK:en";

        const apiURL =
            "https://api.rss2json.com/v1/api.json?rss_url=" +
            encodeURIComponent(rssURL);

        const response = await fetch(apiURL);

        const data = await response.json();

        if (!data.items || data.items.length === 0) {

            container.innerHTML = `
                <div class="error">
                    کوئی خبر نہیں ملی۔
                </div>
            `;

            return;
        }

        allNews = data.items;

        displayNews(allNews);

    } catch (error) {

        container.innerHTML = `
            <div class="error">
                ❌ خبریں لوڈ نہیں ہو سکیں۔<br><br>
                براہِ کرم دوبارہ کوشش کریں۔
            </div>
        `;

    }

}


function displayNews(newsList) {

    const container =
        document.getElementById("newsContainer");

    container.innerHTML = "";

    newsList.forEach(item => {

        const date =
            item.pubDate
            ? new Date(item.pubDate).toLocaleString()
            : "";

        container.innerHTML += `

            <div class="news-card">

                <h2>${item.title}</h2>

                <p>
                    تازہ خبر اور مزید معلومات کے لیے
                    نیچے Read More پر کلک کریں۔
                </p>

                <small>
                    📰 ${date}
                </small>

                <br>

                <a
                    href="${item.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Read More →
                </a>

            </div>

        `;

    });

}


function searchNews() {

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase();

    if (!search) {

        displayNews(allNews);

        return;
    }

    const filtered =
        allNews.filter(item =>
            item.title
            .toLowerCase()
            .includes(search)
        );

    displayNews(filtered);

}


// Website open ہوتے ہی Latest News
showNews("latest");

</script>

</body>
</html>
