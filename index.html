<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pakistan News</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #333;
}

header {
    background: #087f3e;
    color: white;
    text-align: center;
    padding: 20px 10px;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 8px 0 0;
    font-size: 14px;
}

nav {
    background: white;
    padding: 12px 5px;
    text-align: center;
    box-shadow: 0 2px 5px #ccc;
}

nav button {
    background: #087f3e;
    color: white;
    border: none;
    padding: 10px 13px;
    margin: 4px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
}

nav button:hover {
    background: #056631;
}

.search-box {
    text-align: center;
    margin: 15px auto;
    padding: 0 15px;
}

.search-box input {
    width: 100%;
    max-width: 600px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.section-title {
    color: #087f3e;
    border-bottom: 3px solid #087f3e;
    padding-bottom: 8px;
}

.news-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.news-card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px #ccc;
}

.news-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.news-content {
    padding: 15px;
}

.news-content h3 {
    margin-top: 0;
    color: #087f3e;
    font-size: 18px;
}

.news-content p {
    color: #666;
    line-height: 1.5;
}

.read-more {
    display: inline-block;
    background: #087f3e;
    color: white;
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 5px;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #087f3e;
}

.error {
    background: white;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
}

footer {
    background: #087f3e;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}

footer p {
    margin: 7px;
}
</style>
</head>

<body>

<header>
    <h1>🇵🇰 Pakistan News</h1>
    <p>Latest News & Updates from Pakistan</p>
</header>

<nav>
    <button onclick="loadNews('latest')">Latest News</button>
    <button onclick="loadNews('lahore')">Lahore News</button>
    <button onclick="loadNews('karachi')">Karachi News</button>
    <button onclick="loadNews('islamabad')">Islamabad News</button>
    <button onclick="loadNews('national')">National Updates</button>
</nav>

<div class="search-box">
    <input
        id="searchInput"
        type="text"
        placeholder="🔎 Search News..."
        onkeyup="searchNews()"
    >
</div>

<main>

    <h2 class="section-title" id="sectionTitle">
        Latest News
    </h2>

    <div id="newsContainer" class="news-container">
        <div class="loading">
            ⏳ Loading latest news...
        </div>
    </div>

</main>

<footer>
    <p>© 2026 Pakistan News</p>
    <p>All Rights Reserved</p>
</footer>

<script>

/* =====================================
   RSS FEEDS
===================================== */

const feeds = {

    latest: [
        "https://www.dawn.com/feeds/home",
        "https://www.geo.tv/latest-news/?feed=rss"
    ],

    national: [
        "https://www.dawn.com/feeds/home",
        "https://www.geo.tv/latest-news/?feed=rss"
    ],

    lahore: [
        "https://www.dawn.com/feeds/home",
        "https://www.geo.tv/latest-news/?feed=rss"
    ],

    karachi: [
        "https://www.dawn.com/feeds/home",
        "https://www.geo.tv/latest-news/?feed=rss"
    ],

    islamabad: [
        "https://www.dawn.com/feeds/home",
        "https://www.geo.tv/latest-news/?feed=rss"
    ]

};


/* =====================================
   RSS TO JSON
===================================== */

const API = "https://api.rss2json.com/v1/api.json?rss_url=";


/* =====================================
   CURRENT NEWS
===================================== */

let allNews = [];


/* =====================================
   LOAD NEWS
===================================== */

async function loadNews(category) {

    const container =
        document.getElementById("newsContainer");

    const title =
        document.getElementById("sectionTitle");

    const search =
        document.getElementById("searchInput");

    search.value = "";

    const titles = {
        latest: "Latest News",
        lahore: "Lahore News",
        karachi: "Karachi News",
        islamabad: "Islamabad News",
        national: "National Updates"
    };

    title.innerText = titles[category];

    container.innerHTML =
        '<div class="loading">⏳ Loading latest news...</div>';

    allNews = [];

    const selectedFeeds = feeds[category];

    for (const feed of selectedFeeds) {

        try {

            const response =
                await fetch(API + encodeURIComponent(feed));

            const data =
                await response.json();

            if (data.status === "ok") {

                data.items.forEach(item => {

                    allNews.push({
                        title: item.title,
                        description: removeHTML(
                            item.description
                        ),
                        link: item.link,
                        image: getImage(item)
                    });

                });

            }

        } catch (error) {

            console.log(
                "Feed error:",
                error
            );

        }

    }


    /* Remove duplicate headlines */

    const uniqueNews = [];

    const titlesSeen = new Set();

    allNews.forEach(item => {

        if (!titlesSeen.has(item.title)) {

            titlesSeen.add(item.title);

            uniqueNews.push(item);

        }

    });

    allNews = uniqueNews.slice(0, 20);

    displayNews(allNews);

}


/* =====================================
   DISPLAY NEWS
===================================== */

function displayNews(newsList) {

    const container =
        document.getElementById("newsContainer");

    container.innerHTML = "";

    if (newsList.length === 0) {

        container.innerHTML = `
            <div class="error">
                ❌ News load nahi ho saki.
                <br><br>
                Please page refresh karein.
            </div>
        `;

        return;
    }


    newsList.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "news-card";

        card.innerHTML = `

            <img
                src="${item.image}"
                alt="Pakistan News"
                onerror="this.src='https://images.unsplash.com/photo-1521292270410-a8c4d716d518?auto=format&fit=crop&w=900&q=80'"
            >

            <div class="news-content">

                <h3>
                    ${escapeHTML(item.title)}
                </h3>

                <p>
                    ${escapeHTML(
                        item.description.substring(0, 180)
                    )}...
                </p>

                <a
                    href="${item.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="read-more"
                >
                    Read More
                </a>

            </div>

        `;

        container.appendChild(card);

    });

}


/* =====================================
   SEARCH
===================================== */

function searchNews() {

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    if (search === "") {

        displayNews(allNews);

        return;
    }

    const results =
        allNews.filter(item =>
            item.title
            .toLowerCase()
            .includes(search)
        );

    displayNews(results);

}


/* =====================================
   REMOVE HTML
===================================== */

function removeHTML(text) {

    const div =
        document.createElement("div");

    div.innerHTML = text || "";

    return div.textContent || div.innerText || "";

}


/* =====================================
   GET IMAGE
===================================== */

function getImage(item) {

    if (item.thumbnail) {
        return item.thumbnail;
    }

    if (item.enclosure &&
        item.enclosure.link) {

        return item.enclosure.link;

    }

    return "https://images.unsplash.com/photo-1521292270410-a8c4d716d518?auto=format&fit=crop&w=900&q=80";

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.innerText = text || "";

    return div.innerHTML;

}


/* =====================================
   START WEBSITE
===================================== */

loadNews("latest");


/* =====================================
   AUTO REFRESH EVERY 10 MINUTES
===================================== */

setInterval(function() {

    loadNews("latest");

}, 10 * 60 * 1000);

</script>

</body>
</html>
